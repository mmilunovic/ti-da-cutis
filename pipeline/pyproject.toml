[project]
name = "pmute"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "soundfile>=0.12",
  "kaldi-native-fbank>=1.20",
  "matplotlib>=3.8",
]

[project.scripts]
pmute = "pmute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmute"]
